<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Time Zone Clock</title>
<style>
  :root {
    --red:#c70000;
    --black:#111;
    --gray:#f4f4f4;
    --white:#fff;
    --dark-gray:#333;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%);
    color: var(--white);
    min-height: 100vh;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-size: 32px;
    color: var(--red);
    margin-bottom: 10px;
  }
  header p {
    font-size: 16px;
    color: #aaa;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  .clock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }
  .clock-card {
    background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
    border: 2px solid var(--red);
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(199, 0, 0, 0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .clock-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 40px rgba(199, 0, 0, 0.3);
  }
  .city-name {
    font-size: 20px;
    font-weight: 600;
    color: var(--red);
    margin-bottom: 12px;
  }
  .timezone {
    font-size: 12px;
    color: #888;
    margin-bottom: 15px;
  }
  .time-display {
    font-size: 48px;
    font-weight: bold;
    color: var(--white);
    font-family: 'Courier New', monospace;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .date-display {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 15px;
  }
  .am-pm {
    font-size: 18px;
    color: var(--red);
    font-weight: 600;
  }
  .controls {
    text-align: center;
    margin: 30px 0;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    background: var(--red);
    color: var(--white);
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #a00000;
  }
  button.active {
    background: var(--white);
    color: var(--red);
  }
  .format-toggle {
    display: flex;
    gap: 5px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .format-toggle button {
    padding: 8px 16px;
    font-size: 14px;
  }
  .info-section {
    background: rgba(199, 0, 0, 0.1);
    border-left: 4px solid var(--red);
    padding: 20px;
    border-radius: 8px;
    margin-top: 30px;
  }
  .info-section h3 {
    color: var(--red);
    margin-bottom: 10px;
  }
  .info-section p {
    color: #ddd;
    line-height: 1.6;
  }
  .timezone-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 15px;
  }
  .timezone-item {
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .timezone-item:hover {
    background: rgba(199, 0, 0, 0.2);
  }
  @media (max-width: 768px) {
    header h1 {
      font-size: 24px;
    }
    .time-display {
      font-size: 36px;
    }
    .clock-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<header>
  <h1>🌍 Global Time Zone Clock</h1>
  <p>Real-time display across major cities worldwide</p>
</header>

<div class="container">
  <div class="controls">
    <div class="format-toggle">
      <button class="active" onclick="setFormat('12h')">12-Hour</button>
      <button onclick="setFormat('24h')">24-Hour</button>
    </div>
    <div class="btn-group">
      <button onclick="addRandomCity()">➕ Add City</button>
      <button onclick="resetToDefault()">🔄 Reset</button>
    </div>
  </div>

  <div class="clock-grid" id="clockGrid"></div>

  <div class="info-section">
    <h3>Available Time Zones</h3>
    <p>Click on any time zone below to add it to your display:</p>
    <div class="timezone-list" id="timezoneList"></div>
  </div>
</div>

<script>
  const allTimezones = [
    { city: 'New York', timezone: 'America/New_York', flag: '🗽' },
    { city: 'Los Angeles', timezone: 'America/Los_Angeles', flag: '🌴' },
    { city: 'Chicago', timezone: 'America/Chicago', flag: '🏙️' },
    { city: 'Denver', timezone: 'America/Denver', flag: '🏔️' },
    { city: 'London', timezone: 'Europe/London', flag: '🇬🇧' },
    { city: 'Paris', timezone: 'Europe/Paris', flag: '🇫🇷' },
    { city: 'Berlin', timezone: 'Europe/Berlin', flag: '🇩🇪' },
    { city: 'Moscow', timezone: 'Europe/Moscow', flag: '🇷🇺' },
    { city: 'Dubai', timezone: 'Asia/Dubai', flag: '🇦🇪' },
    { city: 'India', timezone: 'Asia/Kolkata', flag: '🇮🇳' },
    { city: 'Bangkok', timezone: 'Asia/Bangkok', flag: '🇹🇭' },
    { city: 'Hong Kong', timezone: 'Asia/Hong_Kong', flag: '🇭🇰' },
    { city: 'Tokyo', timezone: 'Asia/Tokyo', flag: '🇯🇵' },
    { city: 'Sydney', timezone: 'Australia/Sydney', flag: '🇦🇺' },
    { city: 'Auckland', timezone: 'Pacific/Auckland', flag: '🇳🇿' },
    { city: 'Singapore', timezone: 'Asia/Singapore', flag: '🇸🇬' },
    { city: 'Seoul', timezone: 'Asia/Seoul', flag: '🇰🇷' },
    { city: 'São Paulo', timezone: 'America/Sao_Paulo', flag: '🇧🇷' },
    { city: 'Toronto', timezone: 'America/Toronto', flag: '🇨🇦' },
    { city: 'Mexico City', timezone: 'America/Mexico_City', flag: '🇲🇽' },
    { city: 'Singapore', timezone: 'Asia/Singapore', flag: '🇸🇬' },
    { city: 'Bangkok', timezone: 'Asia/Bangkok', flag: '🇹🇭' },
    { city: 'Istanbul', timezone: 'Europe/Istanbul', flag: '🇹🇷' },
    { city: 'Cairo', timezone: 'Africa/Cairo', flag: '🇪🇬' },
    { city: 'Johannesburg', timezone: 'Africa/Johannesburg', flag: '🇿🇦' },
  ];

  let activeTimezones = [
    { city: 'New York', timezone: 'America/New_York', flag: '🗽' },
    { city: 'London', timezone: 'Europe/London', flag: '🇬🇧' },
    { city: 'Tokyo', timezone: 'Asia/Tokyo', flag: '🇯🇵' },
    { city: 'Sydney', timezone: 'Australia/Sydney', flag: '🇦🇺' },
  ];

  let timeFormat = '12h';

  function updateClocks() {
    const gridContainer = document.getElementById('clockGrid');
    gridContainer.innerHTML = '';

    activeTimezones.forEach(({ city, timezone, flag }) => {
      const time = new Date().toLocaleString('en-US', {
        timeZone: timezone,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: timeFormat === '12h'
      });

      const date = new Date().toLocaleString('en-US', {
        timeZone: timezone,
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });

      const ampm = new Date().toLocaleString('en-US', {
        timeZone: timezone,
        hour12: true
      }).slice(-2);

      const card = document.createElement('div');
      card.className = 'clock-card';
      card.innerHTML = `
        <div class="city-name">${flag} ${city}</div>
        <div class="timezone">${timezone}</div>
        <div class="time-display">${time}</div>
        <div class="date-display">${date}</div>
        ${timeFormat === '12h' ? `<div class="am-pm">${ampm}</div>` : ''}
        <button onclick="removeCity('${city}')" style="margin-top: 15px; width: 100%; background: rgba(199, 0, 0, 0.5);">Remove</button>
      `;
      gridContainer.appendChild(card);
    });
  }

  function setFormat(format) {
    timeFormat = format;
    document.querySelectorAll('.format-toggle button').forEach(btn => {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');
    updateClocks();
  }

  function removeCity(city) {
    activeTimezones = activeTimezones.filter(tz => tz.city !== city);
    updateClocks();
  }

  function addRandomCity() {
    const availableCities = allTimezones.filter(
      tz => !activeTimezones.find(active => active.city === tz.city)
    );
    if (availableCities.length > 0) {
      const randomCity = availableCities[Math.floor(Math.random() * availableCities.length)];
      activeTimezones.push(randomCity);
      updateClocks();
    } else {
      alert('All cities are already displayed!');
    }
  }

  function resetToDefault() {
    activeTimezones = [
      { city: 'New York', timezone: 'America/New_York', flag: '🗽' },
      { city: 'London', timezone: 'Europe/London', flag: '🇬🇧' },
      { city: 'Tokyo', timezone: 'Asia/Tokyo', flag: '🇯🇵' },
      { city: 'Sydney', timezone: 'Australia/Sydney', flag: '🇦🇺' },
    ];
    updateClocks();
  }

  function populateTimezoneList() {
    const list = document.getElementById('timezoneList');
    allTimezones.forEach(({ city, timezone, flag }) => {
      const item = document.createElement('div');
      item.className = 'timezone-item';
      item.textContent = `${flag} ${city}`;
      item.onclick = () => {
        if (!activeTimezones.find(tz => tz.city === city)) {
          activeTimezones.push({ city, timezone, flag });
          updateClocks();
        }
      };
      list.appendChild(item);
    });
  }

  // Initial setup
  populateTimezoneList();
  updateClocks();

  // Update every second
  setInterval(updateClocks, 1000);
</script>

</body>
</html>
